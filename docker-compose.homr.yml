services:
  omr-neural:
    build:
      context: ./backend
      dockerfile: Dockerfile.homr
    ports:
      - "${OMR_BIND:-0.0.0.0}:${HOMR_PORT:-8001}:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .omr-server.env}
      APP_DATA_DIR: /data
      ANALYZE_CACHE_DIR: /data/cache/analyze
      PIPELINE_PARAM_SET: v6_homr
      OMR_ENGINE: homr
      PYTHONUNBUFFERED: "1"
    volumes:
      - homr_omr_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  homr_omr_data:
