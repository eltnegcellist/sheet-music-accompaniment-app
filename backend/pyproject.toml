[project]
name = "imslp-accompanist-backend"
version = "0.1.1"
description = "OMR + accompaniment extraction backend"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Hidetaka Ito and contributors" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "lxml>=5.3.0",
  "pydantic>=2.9.0",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17.0",
  "pillow>=10.0.0",
  "pypdf>=4.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "numpy>=1.26",
  "music21>=9.0",
]

[project.urls]
Homepage = "https://github.com/eltnegcellist/sheet-music-accompaniment-app"
Repository = "https://github.com/eltnegcellist/sheet-music-accompaniment-app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
