name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Extract PDF target from IMSLP confirmation page
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          for spec in 'saintsaens:413948' 'beethoven:52413'; do
            label="${spec%%:*}"
            idx="${spec##*:}"
            curl --compressed -A "$UA" -H 'Cookie: redirectPassed=1' -sS               "https://imslp.org/wiki/Special:ImagefromIndex/$idx" -o "/tmp/$label.html"
            echo "===== $label urls ====="
            grep -Eoi '(href|src)="[^"]+"' "/tmp/$label.html" | tail -80 || true
            echo "===== PDF-ish strings ====="
            grep -Eoi '[^"[:space:]<>]+\.pdf[^"[:space:]<>]*' "/tmp/$label.html" | head -20 || true
            echo "===== download/static strings ====="
            grep -Eoi '.{0,120}(download|files|upload|static|Special:Redirect).{0,180}' "/tmp/$label.html" | head -60 || true
          done
