name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Follow IMSLP disclaimer accept endpoint
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          for spec in 'saintsaens:413948' 'beethoven:52413'; do
            label="${spec%%:*}"
            idx="${spec##*:}"
            curl --compressed -A "$UA"               -H 'Cookie: redirectPassed=1'               -e "https://imslp.org/wiki/Special:ImagefromIndex/$idx"               -L --max-redirs 20 -sS -D "/tmp/$label.h"               "https://imslp.org/wiki/Special:IMSLPDisclaimerAccept/$idx"               -o "/tmp/$label.bin"
            echo "===== $label ====="
            tail -120 "/tmp/$label.h"
            file "/tmp/$label.bin"
            wc -c "/tmp/$label.bin"
            head -c 32 "/tmp/$label.bin" | xxd
            sha256sum "/tmp/$label.bin"
          done
