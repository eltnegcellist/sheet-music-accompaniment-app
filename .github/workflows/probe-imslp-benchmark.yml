name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Fetch IMSLP ImageHandler with accepted cookies
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          COOKIE='redirectPassed=1; imslpdisclaimeraccepted=yes'
          for spec in 'saintsaens:413948' 'beethoven:52413'; do
            label="${spec%%:*}"
            idx="${spec##*:}"
            curl --compressed -A "$UA" -H "Cookie: $COOKIE"               -L --max-redirs 20 -sS -D "/tmp/$label.h"               "https://imslp.org/wiki/Special:IMSLPImageHandler/$idx"               -o "/tmp/$label.bin"
            echo "===== $label ====="
            tail -140 "/tmp/$label.h"
            file "/tmp/$label.bin"
            wc -c "/tmp/$label.bin"
            head -c 32 "/tmp/$label.bin" | xxd
            sha256sum "/tmp/$label.bin"
            if file "/tmp/$label.bin" | grep -q HTML; then
              echo "===== html urls ====="
              grep -Eoi '(href|src)="[^"]+"' "/tmp/$label.bin" | tail -100 || true
              grep -Eoi 'https?://[^"[:space:]<>]+' "/tmp/$label.bin" | tail -40 || true
            fi
          done
