name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Fetch IMSLP files with redirectPassed cookie
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          fetch_one() {
            label="$1"
            idx="$2"
            curl --compressed -A "$UA"               -H 'Cookie: redirectPassed=1'               -L --max-redirs 10 -sS -D "/tmp/$label.h"               "https://imslp.org/wiki/Special:ImagefromIndex/$idx"               -o "/tmp/$label.bin"
            echo "===== $label ====="
            tail -100 "/tmp/$label.h"
            file "/tmp/$label.bin"
            wc -c "/tmp/$label.bin"
            head -c 32 "/tmp/$label.bin" | xxd
            sha256sum "/tmp/$label.bin"
          }
          fetch_one saintsaens 413948
          fetch_one beethoven 52413
