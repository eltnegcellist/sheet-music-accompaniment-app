name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Inspect IMSLP friendly redirect
        run: |
          set -euxo pipefail
          curl --compressed -A 'Mozilla/5.0' -fsSL             'https://imslp.org/friendlyredirect.html'             -o /tmp/friendly.html
          echo '===== friendlyredirect.html ====='
          cat /tmp/friendly.html
          echo
          echo '===== scripts ====='
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/friendly.html || true
          grep -Eo 'https?://[^"[:space:]<>]+' /tmp/friendly.html || true

          echo '===== special page compressed/body ====='
          curl --compressed -A 'Mozilla/5.0' -fsSL             'https://imslp.org/wiki/Special:ImagefromIndex/413948'             -o /tmp/index.html
          cat /tmp/index.html
