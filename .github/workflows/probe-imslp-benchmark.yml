name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Retry Beethoven ImageHandler with issued userHash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          BASE='redirectPassed=1; imslpdisclaimeraccepted=yes'
          URL='https://imslp.org/wiki/Special:IMSLPImageHandler/52413'

          curl --compressed -A "$UA" -H "Cookie: $BASE"             -sS -D /tmp/first.h "$URL" -o /tmp/first.html
          HASH="$(sed -n 's/.*[Ss]et-[Cc]ookie: userHash=\([^;]*\).*/\1/p' /tmp/first.h | tail -1 | tr -d '\r')"
          echo "issued userHash=$HASH"
          test -n "$HASH"

          curl --compressed -A "$UA"             -H "Cookie: $BASE; userHash=$HASH"             -L --max-redirs 20 -sS -D /tmp/second.h             "$URL" -o /tmp/beethoven.bin

          tail -140 /tmp/second.h
          file /tmp/beethoven.bin
          wc -c /tmp/beethoven.bin
          head -c 32 /tmp/beethoven.bin | xxd
          sha256sum /tmp/beethoven.bin
