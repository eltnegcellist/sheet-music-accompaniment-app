name: probe-imslp-benchmark-files

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"
    paths:
      - ".github/workflows/probe-imslp-benchmark.yml"

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Beethoven ImageHandler countdown logic
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          BASE='redirectPassed=1; imslpdisclaimeraccepted=yes'
          URL='https://imslp.org/wiki/Special:IMSLPImageHandler/52413'
          curl --compressed -A "$UA" -H "Cookie: $BASE" -sS -D /tmp/h "$URL" -o /tmp/b.html
          echo '===== relevant lines ====='
          python3 - <<'PY'
          import re
          text=open('/tmp/b.html',encoding='utf-8',errors='replace').read()
          pats=['download','setTimeout','location','ImageHandler','userHash','countdown','inter','wait','subscription','js-r','js-s','52413']
          for p in pats:
              print("\n###",p)
              for m in list(re.finditer(p,text,re.I))[:30]:
                  a=max(0,m.start()-300); b=min(len(text),m.end()+700)
                  print(text[a:b].replace('\n',' ')[:1200])
          print("\n### script blocks")
          for s in re.findall(r'<script[^>]*>(.*?)</script>',text,re.I|re.S):
              if any(k.lower() in s.lower() for k in ['download','timeout','location','52413','handler']):
                  print(s[:5000])
          PY
