name: backend-and-audio-verification

on:
  push:
    branches: [main, test/backend-audio-integration]
    paths: ["backend/**", "frontend/**", "scripts/*replay*", "scripts/*audio*", ".github/workflows/backend-audio-verification.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "scripts/*replay*", "scripts/*audio*", ".github/workflows/backend-audio-verification.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-api-audio:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.51.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
      - run: npx vite build
        working-directory: frontend
      - run: bash scripts/run_backend_audio_verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backend-and-audio-verification
          path: verification-results
          if-no-files-found: error
