name: android-upgrade-smoke
on:
  workflow_dispatch:
  push:
    branches: ["test/android-upgrade-smoke"]

permissions:
  contents: read
  actions: read

jobs:
  signed-upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: AFB14F54F734FAB564A93F3549E3E733F1FC97F3FE83AE1C843AF47C41B25BE3
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve exact old and current release APKs
        env:
          BASELINE_URL: ${{ secrets.ANDROID_UPGRADE_BASELINE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$BASELINE_URL"
          curl --fail --silent --show-error "$BASELINE_URL" -o "$RUNNER_TEMP/baseline.apk"
          echo "e1434194dd9e6f4d273d0120b92694a3cbe28c9ea8208f7a5344a1db21f3d584  $RUNNER_TEMP/baseline.apk" | sha256sum -c -
          gh run download 36680296094 --name IMSLP-Accompanist-Android-stable-update --dir "$RUNNER_TEMP/current"
          echo "2ac55dcbaae65d91ec0d59328628db0c5acc9e16aa28b34e23331f039df708d6  $RUNNER_TEMP/current/IMSLP-Accompanist-Android-v0.2.4.apk" | sha256sum -c -
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore the existing fixed key for the instrumentation APK
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/existing-release.jks"
          chmod 600 "$RUNNER_TEMP/existing-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/existing-release.jks" >> "$GITHUB_ENV"
      - name: Build release instrumentation only
        run: gradle -p android assembleReleaseAndroidTest
      - name: Verify all APK signatures and fixed certificates
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          for APK in "$RUNNER_TEMP/baseline.apk" "$RUNNER_TEMP/current/IMSLP-Accompanist-Android-v0.2.4.apk" android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
            grep -qx 'Number of signers: 1' "$RUNNER_TEMP/signature.txt"
            ACTUAL="$(sed -n 's/^.* certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr -d ':' | tr '[:lower:]' '[:upper:]' | sort -u)"
            test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
            echo "Verified fixed certificate: $(basename "$APK")"
          done
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual signed APK update on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android_upgrade_smoke.sh
      - name: Remove temporary signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/existing-release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-signed-upgrade-smoke-results
          path: smoke-results/
          if-no-files-found: warn
