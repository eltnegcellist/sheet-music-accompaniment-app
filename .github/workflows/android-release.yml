name: android-stable-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: "AFB14F54F734FAB564A93F3549E3E733F1FC97F3FE83AE1C843AF47C41B25BE3"
    steps:
      - uses: actions/checkout@v6

      - name: Verify signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Verify pinned public certificate
        run: |
          ACTUAL="$(openssl x509             -in android/signing/imslp-accompanist-release-cert.pem             -noout -fingerprint -sha256             | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "Pinned certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build web UI
        working-directory: frontend
        run: npx vite build

      - name: Stage WebView assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R frontend/dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore fixed release keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imslp-accompanist-release.jks"
          chmod 600 "$RUNNER_TEMP/imslp-accompanist-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/imslp-accompanist-release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore certificate is the pinned certificate
        run: |
          ACTUAL="$(keytool -list -v             -keystore "$ANDROID_KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS"             | sed -n 's/^[[:space:]]*SHA256: //p'             | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "Keystore certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"

      - name: Build fixed-signed release APK
        run: gradle -p android assembleRelease

      - name: Verify APK signature and certificate
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)/apksigner"
          set -euo pipefail
          REPORT="$RUNNER_TEMP/imslp-apk-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$REPORT"
          grep -qx 'Number of signers: 1' "$REPORT"
          # Read certificate digests independently of SDK-specific signer labels.
          ACTUAL="$(sed -n 's/^.* certificate SHA-256 digest: //p' "$REPORT" \
            | tr -d ':' | tr '[:lower:]' '[:upper:]' | sort -u)"
          echo "APK certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"

      - name: Name stable update APK
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "IMSLP-Accompanist-Android-v${VERSION}.apk"
          sha256sum "IMSLP-Accompanist-Android-v${VERSION}.apk" > "IMSLP-Accompanist-v${VERSION}-SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: IMSLP-Accompanist-Android-stable-update
          path: |
            IMSLP-Accompanist-Android-v*.apk
            IMSLP-Accompanist-v*-SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish verified APK and matching checksum
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${ANDROID_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing release points to another commit; keeping this build as an artifact."
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Android ${ANDROID_VERSION}, package app.imslp.accompanist.
          Signed with the existing v0.2.2/v0.2.3 release key; install over the existing app to retain data.
          Audiveris remains the default; Audiveris, homr and Hybrid are selectable.
          Fixes declaration-free MusicXML display and releases sustained notes on Stop.
          Source: $GITHUB_SHA
          Certificate SHA-256: $EXPECTED_CERT_SHA256
          Galaxy S25 speaker, sharing and physical update checks remain to be performed.
          EOF
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "IMSLP Accompanist $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "IMSLP-Accompanist-Android-v${ANDROID_VERSION}.apk" "IMSLP-Accompanist-v${ANDROID_VERSION}-SHA256SUMS.txt" --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false
