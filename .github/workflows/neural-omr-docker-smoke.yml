name: neural-omr-docker-smoke

on:
  push:
    branches:
      - "feature/neural-omr-server"

jobs:
  neural-server-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Build self-hosted OMR image with neural models
        run: docker build --progress=plain -t imslp-accompanist-omr-neural-smoke backend

      - name: Verify homr runtime inside image
        run: |
          docker run --rm \
            -e HOMR_COMMAND="uvx --python 3.11 --from homr==0.7.0 homr" \
            imslp-accompanist-omr-neural-smoke \
            sh -lc 'uvx --python 3.11 --from homr==0.7.0 homr --help >/dev/null'

      - name: Start API and verify dual-engine capability
        run: |
          docker run -d --name omr-smoke -p 18000:8000 \
            -e API_TOKEN=smoke-token \
            -e HOMR_COMMAND="uvx --python 3.11 --from homr==0.7.0 homr" \
            imslp-accompanist-omr-neural-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health
          curl -fsS \
            -H 'Authorization: Bearer smoke-token' \
            http://127.0.0.1:18000/capabilities \
            | grep -q '"homr"'
          docker logs omr-smoke
