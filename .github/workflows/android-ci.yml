name: android-ci

on:
  push:
    branches: [main, "feature/android**"]
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build web UI for Android
        working-directory: frontend
        run: npx vite build

      - name: Stage WebView assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R frontend/dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Export Android signing tools
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)"
          mkdir -p /tmp/android-signing-tools
          cp -R "$BUILD_TOOLS_DIR" /tmp/android-signing-tools/build-tools
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: /tmp/android-signing-tools
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle -p android assembleRelease

      - name: Confirm release APK is unsigned
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          if "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)/apksigner" verify "$APK"; then
            echo "Release APK unexpectedly already signed" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: IMSLP-Accompanist-Android-v0.2.2-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
