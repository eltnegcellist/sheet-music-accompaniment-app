name: hybrid-omr-system-constrained

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"
    paths:
      - ".github/workflows/hybrid-omr-system-constrained.yml"

permissions:
  actions: read
  contents: read

jobs:
  hybrid-c:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Download prior Audiveris projects
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hybridc/prev
          gh run download 36505447483 \
            --repo "$GITHUB_REPOSITORY" \
            --name hybrid-audiveris-layout-homr-piano-benchmark \
            --dir /tmp/hybridc/prev
          find /tmp/hybridc/prev -name '*.omr' -print

      - name: Download exact scores and extract benchmark pages
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pypdf opencv-python-headless
          curl -fL --retry 3 \
            'https://s9.imslp.org/files/imglnks/usimg/8/80/IMSLP52413-PMLP04421-Beethoven_Werke_Breitkopf_Serie_13_No_107_Op_69.pdf' \
            -o /tmp/hybridc/beethoven.pdf
          curl -fL --retry 3 \
            'https://s9.imslp.org/files/imglnks/usimg/e/e2/IMSLP413948-PMLP30030-Saint_Saens_Allegro_Mandozzi_Vc_Kl_-_Partitur.pdf' \
            -o /tmp/hybridc/saintsaens.pdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          root=Path('/tmp/hybridc')
          for source,page,case in [
              ('beethoven',3,'beethoven-p03'),
              ('beethoven',11,'beethoven-p11'),
              ('beethoven',24,'beethoven-p24'),
              ('saintsaens',1,'saint-p01'),
          ]:
              r=PdfReader(root/f'{source}.pdf')
              w=PdfWriter(); w.add_page(r.pages[page-1])
              with (root/f'{case}.pdf').open('wb') as fh: w.write(fh)
          PY

      - name: Build neural OMR image
        run: docker build --progress=plain -t imslp-hybrid-c backend

      - name: Rasterize exact pages
        run: |
          mkdir -p /tmp/hybridc/pages
          for case in beethoven-p03 beethoven-p11 beethoven-p24 saint-p01; do
            docker run --rm -v /tmp/hybridc:/bench imslp-hybrid-c \
              sh -lc "pdftoppm -png -r 300 -f 1 -singlefile /bench/$case.pdf /bench/pages/$case"
          done

      - name: Constrain by Audiveris systems and redetect staves visually
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cv2, json, zipfile
          import numpy as np
          import xml.etree.ElementTree as ET

          root=Path('/tmp/hybridc')
          prev=root/'prev'
          out=root/'crops'; out.mkdir(exist_ok=True)
          expected={'beethoven-p03':24,'beethoven-p11':18,'beethoven-p24':29,'saint-p01':26}
          audit={}

          def staff_line_ys(staff):
              ys=[]
              for line in staff.findall('./lines/line'):
                  pts=[float(p.get('y')) for p in line.findall('./point') if p.get('y') is not None]
                  if pts:
                      ys.append(float(np.mean(pts)))
              return ys

          def system_anchor(system):
              ys=[]
              for staff in system.findall('./part/staff'):
                  ys.extend(staff_line_ys(staff))
              if not ys:
                  return None
              return float(np.mean(ys))

          def detect_staff_centers(img, y0, y1):
              region=img[y0:y1,:]
              gray=cv2.cvtColor(region,cv2.COLOR_BGR2GRAY)
              bw=cv2.threshold(gray,205,255,cv2.THRESH_BINARY_INV)[1]
              # Long horizontal morphology isolates staff lines but tolerates
              # old-scan breaks better than requiring full-width lines.
              k=max(45,img.shape[1]//15)
              horiz=cv2.morphologyEx(
                  bw, cv2.MORPH_OPEN,
                  cv2.getStructuringElement(cv2.MORPH_RECT,(k,1))
              )
              score=(horiz>0).sum(axis=1)
              rows=np.where(score > img.shape[1]*0.16)[0]
              if len(rows)==0:
                  return [], bw
              # Collapse thick/duplicate rows.
              lines=[]
              s=p=int(rows[0])
              for rr in rows[1:]:
                  rr=int(rr)
                  if rr <= p+3:
                      p=rr
                  else:
                      lines.append((s+p)/2); s=p=rr
              lines.append((s+p)/2)
              if len(lines)<5:
                  return [], bw

              diffs=np.diff(lines)
              positive=[d for d in diffs if 3 <= d <= 80]
              gap=float(np.median(sorted(positive)[:max(4,len(positive)//2)])) if positive else 12.0

              # Score every run of five roughly equally-spaced horizontal
              # lines; greedily keep non-overlapping candidates.
              candidates=[]
              for i in range(len(lines)-4):
                  five=np.array(lines[i:i+5],dtype=float)
                  ds=np.diff(five)
                  med=float(np.median(ds))
                  if med < max(4,gap*0.55) or med > max(40,gap*2.2):
                      continue
                  cv=float(np.std(ds)/(med+1e-6))
                  if cv <= 0.35:
                      candidates.append((cv,float(np.mean(five)),i,i+4,med))
              candidates.sort()
              chosen=[]
              used=set()
              for cand in candidates:
                  _,center,a,b,_=cand
                  ids=set(range(a,b+1))
                  if used & ids:
                      continue
                  chosen.append(cand); used |= ids
              centers=sorted([c[1]+y0 for c in chosen])
              return centers, bw

          for case,truth in expected.items():
              omrs=list((prev/'audiveris-results'/case/'audiveris').rglob('*.omr'))
              if not omrs:
                  raise RuntimeError(f'{case}: no Audiveris .omr')
              with zipfile.ZipFile(omrs[0]) as zf:
                  sheet_name=next(n for n in zf.namelist() if n.endswith('.xml') and 'sheet#' in n)
                  x=ET.fromstring(zf.read(sheet_name))

              img=cv2.imread(str(root/'pages'/f'{case}.png'))
              if img is None:
                  raise RuntimeError(f'{case}: page image missing')
              picture=x.find('./picture')
              src_h=float(picture.get('height'))
              sy=img.shape[0]/src_h

              systems=x.findall('./page/system')
              anchors=[]
              for sys in systems:
                  a=system_anchor(sys)
                  anchors.append(a*sy if a is not None else None)

              # Fill any missing anchors by interpolation so every Audiveris
              # System still defines a local search region.
              for i,a in enumerate(anchors):
                  if a is not None:
                      continue
                  before=next((anchors[j] for j in range(i-1,-1,-1) if anchors[j] is not None),None)
                  after=next((anchors[j] for j in range(i+1,len(anchors)) if anchors[j] is not None),None)
                  if before is not None and after is not None:
                      anchors[i]=(before+after)/2
                  elif before is not None:
                      anchors[i]=before+img.shape[0]/max(5,len(anchors))
                  elif after is not None:
                      anchors[i]=after-img.shape[0]/max(5,len(anchors))
                  else:
                      anchors[i]=(i+0.5)*img.shape[0]/len(anchors)

              boundaries=[0]
              for a,b in zip(anchors,anchors[1:]):
                  boundaries.append(int((a+b)/2))
              boundaries.append(img.shape[0])

              gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)
              bw_full=cv2.threshold(gray,210,255,cv2.THRESH_BINARY_INV)[1]
              density=(bw_full>0).sum(axis=1).astype(np.float32)
              smooth=np.convolve(density,np.ones(13)/13,mode='same')

              case_out=out/case; case_out.mkdir(parents=True,exist_ok=True)
              records=[]
              for si,system in enumerate(systems,1):
                  region0=max(0,boundaries[si-1])
                  region1=min(img.shape[0],boundaries[si])
                  centers,_=detect_staff_centers(img,region0,region1)

                  # Typical cello+piano system should expose 3 staves. If the
                  # detector has extras, the bottom three real staff centers
                  # are the safest candidates because lyrics/text tend to sit
                  # outside the long-horizontal-line pattern.
                  if len(centers) >= 3:
                      selected=centers[-3:]
                      solo,treble,bass=selected
                  elif len(centers)==2:
                      # Audiveris may have retained the solo staff while CV
                      # catches only the piano pair; accept the visual pair.
                      treble,bass=centers
                      solo=None
                  else:
                      # Last fallback: use whatever Staff y values Audiveris did
                      # preserve and combine with global horizontal projection.
                      aud_ys=[]
                      for st in system.findall('./part/staff'):
                          aud_ys.extend([y*sy for y in staff_line_ys(st)])
                      aud_centers=[]
                      if aud_ys:
                          aud_ys=sorted(aud_ys)
                          for k in range(0,len(aud_ys),5):
                              block=aud_ys[k:k+5]
                              if block: aud_centers.append(float(np.mean(block)))
                      pool=sorted(set([round(v,1) for v in centers+aud_centers]))
                      if len(pool)<2:
                          raise RuntimeError(f'{case} system {si}: cannot identify two piano staves; cv={centers} aud={aud_centers}')
                      treble,bass=pool[-2:]
                      solo=pool[-3] if len(pool)>=3 else None

                  # Top boundary: minimum-ink whitespace between solo and piano.
                  if solo is not None and treble-solo>20:
                      lo=int(max(region0,solo+8))
                      hi=int(min(region1-1,treble-8))
                      y0=lo+int(np.argmin(smooth[lo:hi+1])) if hi>lo else int((solo+treble)/2)
                  else:
                      y0=max(region0,int(treble-(bass-treble)*0.7))

                  # Bottom boundary never crosses the Audiveris System region,
                  # preventing the p3 contamination seen in Hybrid A.
                  gap=max(20,bass-treble)
                  search_lo=int(min(region1-1,bass+8))
                  search_hi=int(min(region1-1,bass+gap*0.9))
                  if search_hi>search_lo:
                      y1=search_lo+int(np.argmin(smooth[search_lo:search_hi+1]))
                  else:
                      y1=region1
                  y1=min(y1,region1)

                  y0=max(region0,y0-5); y1=min(region1,y1+5)
                  # Full page width is intentional; homr autocrops horizontally
                  # and keeping clefs/key signatures is critical.
                  crop=img[y0:y1,:]
                  path=case_out/f'system_{si:02d}.png'
                  cv2.imwrite(str(path),crop)
                  records.append({
                      'system':si,
                      'audiveris_stacks':len(system.findall('./stack')),
                      'region':[region0,region1],
                      'cv_staff_centers':centers,
                      'selected':{'solo':solo,'treble':treble,'bass':bass},
                      'crop_y':[y0,y1],
                  })

              audit[case]={'expected_measures':truth,'systems':records}

          (root/'hybrid_c_audit.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps(audit,indent=2))
          PY

      - name: Run homr only on system-constrained piano crops
        run: |
          set -euxo pipefail
          for case in beethoven-p03 beethoven-p11 beethoven-p24 saint-p01; do
            docker run --rm \
              -v /tmp/hybridc:/bench \
              imslp-hybrid-c \
              sh -lc "uvx --python 3.11 --from homr==0.7.0 homr /bench/crops/$case"
          done

      - name: Summarize Hybrid C against Audiveris measure stacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET

          root=Path('/tmp/hybridc')
          expected={'beethoven-p03':24,'beethoven-p11':18,'beethoven-p24':29,'saint-p01':26}
          audit=json.loads((root/'hybrid_c_audit.json').read_text())
          summary={}
          for case,truth in expected.items():
              systems=[]; total=pitched=rests=0
              aud_total=sum(s['audiveris_stacks'] for s in audit[case]['systems'])
              for p in sorted((root/'crops'/case).glob('system_*.musicxml')):
                  x=ET.fromstring(p.read_text(errors='replace'))
                  parts=x.findall('./part')
                  m=max((len(q.findall('measure')) for q in parts),default=0)
                  n=len([z for z in x.findall('.//note') if z.find('pitch') is not None])
                  rr=len([z for z in x.findall('.//note') if z.find('rest') is not None])
                  names={sp.get('id'):sp.findtext('part-name') for sp in x.findall('./part-list/score-part')}
                  part_names=[names.get(q.get('id')) for q in parts]
                  total+=m; pitched+=n; rests+=rr
                  systems.append({
                      'file':p.name,'parts':len(parts),'part_names':part_names,
                      'measures':m,'pitched':n,'rests':rr,
                  })
              summary[case]={
                  'expected_measures':truth,
                  'audiveris_stack_count':aud_total,
                  'hybrid_c_measures':total,
                  'measure_error_vs_expected':total-truth,
                  'measure_error_vs_audiveris_stacks':total-aud_total,
                  'pitched_notes':pitched,'rests':rests,'systems':systems,
              }
          (root/'hybrid_c_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-c-system-constrained-homr
          path: |
            /tmp/hybridc/hybrid_c_audit.json
            /tmp/hybridc/hybrid_c_summary.json
            /tmp/hybridc/crops
          if-no-files-found: error
