name: hybrid-omr-audiveris-coordinates

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"
    paths:
      - ".github/workflows/hybrid-omr-audiveris-coordinates.yml"

permissions:
  actions: read
  contents: read

jobs:
  hybrid-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Download prior Audiveris projects
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hybridb/prev
          gh run download 36505447483 \
            --repo "$GITHUB_REPOSITORY" \
            --name hybrid-audiveris-layout-homr-piano-benchmark \
            --dir /tmp/hybridb/prev
          find /tmp/hybridb/prev -name '*.omr' -print

      - name: Download exact scores and extract pages
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pypdf opencv-python-headless
          curl -fL --retry 3 \
            'https://s9.imslp.org/files/imglnks/usimg/8/80/IMSLP52413-PMLP04421-Beethoven_Werke_Breitkopf_Serie_13_No_107_Op_69.pdf' \
            -o /tmp/hybridb/beethoven.pdf
          curl -fL --retry 3 \
            'https://s9.imslp.org/files/imglnks/usimg/e/e2/IMSLP413948-PMLP30030-Saint_Saens_Allegro_Mandozzi_Vc_Kl_-_Partitur.pdf' \
            -o /tmp/hybridb/saintsaens.pdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter
          root=Path('/tmp/hybridb')
          for source,page,case in [
              ('beethoven',3,'beethoven-p03'),
              ('beethoven',11,'beethoven-p11'),
              ('beethoven',24,'beethoven-p24'),
              ('saintsaens',1,'saint-p01'),
          ]:
              r=PdfReader(root/f'{source}.pdf')
              w=PdfWriter(); w.add_page(r.pages[page-1])
              with (root/f'{case}.pdf').open('wb') as fh: w.write(fh)
          PY

      - name: Build neural OMR image
        run: docker build --progress=plain -t imslp-hybrid-b backend

      - name: Rasterize exact pages
        run: |
          mkdir -p /tmp/hybridb/pages
          for case in beethoven-p03 beethoven-p11 beethoven-p24 saint-p01; do
            docker run --rm -v /tmp/hybridb:/bench imslp-hybrid-b \
              sh -lc "pdftoppm -png -r 300 -f 1 -singlefile /bench/$case.pdf /bench/pages/$case"
          done

      - name: Crop piano from Audiveris Staff/System coordinates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cv2, json, zipfile
          import numpy as np
          import xml.etree.ElementTree as ET

          root=Path('/tmp/hybridb')
          prev=root/'prev'
          out=root/'crops'; out.mkdir(exist_ok=True)
          expected={'beethoven-p03':24,'beethoven-p11':18,'beethoven-p24':29,'saint-p01':26}
          audit={}

          def staff_bounds(staff):
              ys=[]
              for line in staff.findall('./lines/line'):
                  for pt in line.findall('./point'):
                      y=pt.get('y')
                      if y is not None:
                          ys.append(float(y))
              if not ys:
                  raise RuntimeError('staff has no line points')
              return min(ys),max(ys),float(staff.get('left') or 0),float(staff.get('right') or 0)

          for case in expected:
              omrs=list((prev/'audiveris-results'/case/'audiveris').rglob('*.omr'))
              if not omrs:
                  raise RuntimeError(f'{case}: no Audiveris .omr')
              with zipfile.ZipFile(omrs[0]) as zf:
                  sheet_name=next(n for n in zf.namelist() if n.endswith('.xml') and 'sheet#' in n)
                  x=ET.fromstring(zf.read(sheet_name))

              img=cv2.imread(str(root/'pages'/f'{case}.png'))
              if img is None: raise RuntimeError(f'{case}: page image missing')
              gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)
              bw=cv2.threshold(gray,210,255,cv2.THRESH_BINARY_INV)[1]
              density=(bw>0).sum(axis=1).astype(np.float32)
              smooth=np.convolve(density,np.ones(11)/11,mode='same')

              picture=x.find('./picture')
              src_h=float(picture.get('height')); src_w=float(picture.get('width'))
              sy=img.shape[0]/src_h; sx=img.shape[1]/src_w

              systems=x.findall('./page/system')
              case_out=out/case; case_out.mkdir(parents=True,exist_ok=True)
              records=[]
              for si,system in enumerate(systems,1):
                  parts=system.findall('./part')
                  # Audiveris may split the piano grand staff into separate
                  # logical parts on difficult systems. Use its geometric Staff
                  # coordinates instead: in cello+piano scores the bottom two
                  # detected staves are the piano grand staff.
                  all_staves=[
                      s for p in parts
                      for s in p.findall('./staff')
                  ]
                  if len(all_staves) < 3:
                      raise RuntimeError(f'{case} system {si}: expected at least 3 detected staves, got {len(all_staves)}')
                  ordered=sorted(
                      all_staves,
                      key=lambda s: sum(staff_bounds(s)[:2]) / 2,
                  )
                  p_staves=ordered[-2:]
                  solo_staves=ordered[:-2]
                  p_bounds=[staff_bounds(s) for s in p_staves]
                  piano_top=min(b[0] for b in p_bounds)*sy
                  piano_bottom=max(b[1] for b in p_bounds)*sy
                  left=min(b[2] for b in p_bounds)*sx
                  right=max(b[3] for b in p_bounds)*sx
                  if solo_staves:
                      solo_bottom=max(staff_bounds(s)[1] for s in solo_staves)*sy
                      lo=int(max(0,solo_bottom+4))
                      hi=int(min(img.shape[0]-1,piano_top-4))
                      y0=(lo+int(np.argmin(smooth[lo:hi+1]))) if hi>lo else int((solo_bottom+piano_top)/2)
                  else:
                      y0=max(0,int(piano_top-80*sy))

                  if si < len(systems):
                      next_parts=systems[si].findall('./part')
                      next_staffs=[s for p in next_parts for s in p.findall('./staff')]
                      next_top=min(staff_bounds(s)[0] for s in next_staffs)*sy
                      lo=int(max(0,piano_bottom+4))
                      hi=int(min(img.shape[0]-1,next_top-4))
                      y1=(lo+int(np.argmin(smooth[lo:hi+1]))) if hi>lo else int((piano_bottom+next_top)/2)
                  else:
                      interlines=[]
                      for s in p_staves:
                          lines=[]
                          for line in s.findall('./lines/line'):
                              ys=[float(pt.get('y')) for pt in line.findall('./point') if pt.get('y')]
                              if ys: lines.append(float(np.mean(ys)))
                          if len(lines)>=2: interlines.extend(np.diff(sorted(lines)))
                      inter=float(np.median(interlines))*sy if interlines else 18*sy
                      y1=min(img.shape[0],int(piano_bottom+inter*7))

                  x0=max(0,int(left-60*sx)); x1=min(img.shape[1],int(right+60*sx))
                  y0=max(0,y0-4); y1=min(img.shape[0],y1+4)
                  crop=img[y0:y1,x0:x1]
                  path=case_out/f'system_{si:02d}.png'
                  cv2.imwrite(str(path),crop)
                  stack_count=len(system.findall('./stack'))
                  records.append({
                      'system':si,'audiveris_stacks':stack_count,
                      'piano_top':piano_top,'piano_bottom':piano_bottom,
                      'crop':[x0,y0,x1,y1],
                  })
              audit[case]={'expected_measures':expected[case],'systems':records}

          (root/'coordinate_crop_audit.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps(audit,indent=2))
          PY

      - name: Run homr on Audiveris-coordinate piano crops
        run: |
          set -euxo pipefail
          for case in beethoven-p03 beethoven-p11 beethoven-p24 saint-p01; do
            docker run --rm \
              -v /tmp/hybridb:/bench \
              imslp-hybrid-b \
              sh -lc "uvx --python 3.11 --from homr==0.7.0 homr /bench/crops/$case"
          done

      - name: Summarize hybrid B
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          root=Path('/tmp/hybridb')
          expected={'beethoven-p03':24,'beethoven-p11':18,'beethoven-p24':29,'saint-p01':26}
          audit=json.loads((root/'coordinate_crop_audit.json').read_text())
          summary={}
          for case,truth in expected.items():
              systems=[]; total=pitched=rests=0
              for p in sorted((root/'crops'/case).glob('system_*.musicxml')):
                  x=ET.fromstring(p.read_text(errors='replace'))
                  parts=x.findall('./part')
                  m=max((len(q.findall('measure')) for q in parts),default=0)
                  names={sp.get('id'):sp.findtext('part-name') for sp in x.findall('./part-list/score-part')}
                  pn=[names.get(q.get('id')) for q in parts]
                  n=len([z for z in x.findall('.//note') if z.find('pitch') is not None])
                  r=len([z for z in x.findall('.//note') if z.find('rest') is not None])
                  total+=m; pitched+=n; rests+=r
                  systems.append({'file':p.name,'parts':len(parts),'part_names':pn,'measures':m,'pitched':n,'rests':r})
              aud_stacks=sum(s['audiveris_stacks'] for s in audit[case]['systems'])
              summary[case]={
                  'expected_measures':truth,
                  'audiveris_stack_count':aud_stacks,
                  'hybrid_measures':total,
                  'measure_error':total-truth,
                  'pitched_notes':pitched,
                  'rests':rests,
                  'systems':systems,
              }
          (root/'hybrid_b_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-b-audiveris-staff-coordinates-homr
          path: |
            /tmp/hybridb/coordinate_crop_audit.json
            /tmp/hybridb/hybrid_b_summary.json
            /tmp/hybridb/crops
          if-no-files-found: error
