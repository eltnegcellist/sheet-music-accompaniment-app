name: verify-six-imslp-downloads

on:
  push:
    branches:
      - "experiment/omr-real-score-benchmark"
    paths:
      - ".github/workflows/verify-six-imslp-downloads.yml"

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify six PDFs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/six
          declare -A URLS=(
            [112439]='https://imslp.org/images/4/43/PMLP43440-Brahms_Werke_Band_10_Breitkopf_JB_39_Op_38_scan.pdf'
            [112440]='https://imslp.org/images/e/e0/PMLP43440-Brahms_Werke_Band_10_Breitkopf_JB_39_Op_38_filter.pdf'
            [116248]='https://imslp.org/images/3/33/PMLP05808-FChopin_Cello_Sonata%2C_Op.65_BH11_piano_score.pdf'
            [40771]='https://imslp.org/images/3/3f/PMLP18960-Mendelssohn_-_Variations_Concertantes_Op17_CelloPiano.pdf'
            [291389]='https://imslp.org/images/f/ff/PMLP30030-Saint-Saens_-_Allegro_Appassionato_Op43_%28E_Schroeder%29_for_Cello_and_Piano.pdf'
            [413948]='https://imslp.org/images/e/e2/PMLP30030-Saint_Saens_Allegro_Mandozzi_Vc_Kl_-_Partitur.pdf'
          )
          failed=0
          for id in 112439 112440 116248 40771 291389 413948; do
            set +e
            curl --compressed -fL --retry 2 --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0' "${URLS[$id]}" -o "/tmp/six/$id.pdf"
            rc=$?
            set -e
            kind="$(file -b "/tmp/six/$id.pdf" 2>/dev/null || true)"
            prefix="$(head -c 5 "/tmp/six/$id.pdf" 2>/dev/null || true)"
            size="$(stat -c %s "/tmp/six/$id.pdf" 2>/dev/null || echo 0)"
            if [ "$rc" -eq 0 ] && [ "$prefix" = '%PDF-' ]; then
              echo "RESULT $id OK bytes=$size kind=$kind sha256=$(sha256sum "/tmp/six/$id.pdf" | awk '{print $1}')"
            else
              echo "RESULT $id BLOCKED_OR_NOT_PDF rc=$rc bytes=$size kind=$kind prefix=$(printf %q "$prefix")"
              head -c 500 "/tmp/six/$id.pdf" 2>/dev/null | tr '\n' ' ' || true
              echo
              failed=1
            fi
          done
          exit "$failed"
